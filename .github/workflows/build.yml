name: Build
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            architecture: '-DCMAKE_OSX_ARCHITECTURES=arm64'
          - os: macos-15-intel
            architecture: '-DCMAKE_OSX_ARCHITECTURES=x86_64'
          - os: windows-2022
            architecture: '-A x64'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build ${{ matrix.architecture }} -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 3
      - run: ctest --test-dir build -C Release --output-on-failure
